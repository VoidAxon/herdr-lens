name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Both supported platforms, and the oldest Python the plugin claims to
    # accept — `tomllib` sets that floor at 3.11.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # No install step: the plugin is standard library only, and a dependency
      # appearing here would be a defect worth failing over.
      - run: python3 -m unittest discover -s tests -t . -v
